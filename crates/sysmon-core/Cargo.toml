# The pure core. It must never depend on ratatui, crossterm, std::process or
# threads: that absence is what makes "layout is a pure function of (size,
# data)" a fact the compiler checks rather than a rule reviewers must remember.
[package]
name = "sysmon-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
regex = "1"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "=0.2.0"

[lints]
workspace = true
