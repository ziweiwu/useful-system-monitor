name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The cargo tools the Rust gate runs, pinned: each job's tool cache is keyed on
# these, so only a version bump pays for building them again.
env:
  CARGO_TEST_TOOLS: cargo-nextest@0.9.148
  CARGO_SUPPLY_CHAIN_TOOLS: cargo-deny@0.20.2 cargo-vet@0.10.2 cargo-machete@0.9.2
  CARGO_MUTANTS_TOOLS: cargo-mutants@27.1.0 cargo-nextest@0.9.148
  CARGO_RELEASE_TOOLS: cargo-auditable@0.7.7 cargo-audit@0.22.2

jobs:
  check:
    # macOS only: this is the TypeScript build, whose collectors read
    # ps/vm_stat/ioreg/pmset. The Rust jobs below cover Linux.
    runs-on: macos-latest

    strategy:
      fail-fast: false
      # Both Node lines package.json still claims to support: 24 is the current
      # LTS, 22 is in maintenance until April 2027. Testing only the newest
      # would leave the `engines` field an untested promise.
      matrix:
        node: [22, 24]

    name: check (node ${{ matrix.node }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the versions agree
        run: npm run verify:versions

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the built CLI
        run: npm run verify:smoke

      # I-10b. `verify:smoke` above already answers the decisive question —
      # which React build the binary actually evaluated — but only this one
      # measures the consequence, and the bug it guards against was invisible
      # to all 441 unit tests: nothing this repo owns was leaking. ~20s.
      #
      # One Node version: it measures allocation, not runtime behaviour. A
      # loaded runner draws fewer frames per tick and so grows *less*, which
      # makes the budget biased safe rather than flaky.
      - name: Long-run heap check
        if: matrix.node == 24
        run: npm run verify:longrun

      # The only check that mounts the dashboard from the built binary. The
      # suite renders `App` with ink-testing-library, and `verify:smoke` runs
      # --json, which returns before render() is reached -- so a build that
      # loads but cannot mount passed everything else. One did: it drew six
      # bytes and exited 0, and the heap check called it flat. ~12s.
      - name: End-to-end TUI check
        if: matrix.node == 24
        run: npm run verify:tui

      # The two harnesses that found the 0.8.x and 0.9.0 layout bugs. On one
      # Node version only: they exercise rendering, not the runtime, so running
      # them twice buys nothing. A reduced grid keeps CI to about a minute —
      # `npm run verify:layout` with no COLS/ROWS sweeps the full 1260 frames.
      - name: Layout sweep
        if: matrix.node == 24
        env:
          COLS: 50,72,80,120
          ROWS: 10,24,40
        run: npm run verify:layout

      # 40 seeds, not a token handful: the mode-stacking bug that prompted this
      # harness only reproduces on seed 33, so a 12-seed run passes clean with
      # the bug reinstated — a step that cannot fail. 40 seeds catches it in
      # ~35s. Verified by reverting the fix and watching this go red.
      - name: Fuzz the keyboard
        if: matrix.node == 24
        run: npm run qa:fuzz -- --seeds 40 --steps 60

  # The Rust build, which is what `bin` now points at. Both platforms, because
  # the collectors are the half of the port that differs between them and a
  # macOS-only check would let a Linux regression through to a published
  # binary.
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    name: rust (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The clippy ratchet judges the lines this change touches, against
          # the merge base, so it needs the history to find one.
          fetch-depth: 0

      - name: Install the toolchain
        run: rustup target add ${{ matrix.target }}

      # actions/cache rather than a third-party Rust cache action: this repo's
      # Actions policy allows GitHub-owned actions only, and widening it for a
      # build cache is not a trade worth making.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      # cargo install rather than a third-party installer action, for the same
      # reason.
      - uses: actions/cache@v6
        id: cargo-tools
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_TEST_TOOLS }}
      - name: Install the cargo tools
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: |
          read -ra tools <<< "$CARGO_TEST_TOOLS"
          cargo install --locked --root ~/.cargo-tools "${tools[@]}"
      - run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"

      # The same npm scripts `npm run verify:rust` and the Stop hook run.
      - name: Format
        run: npm run fmt:rust

      # Every clippy lint fatal, except arithmetic_side_effects and
      # indexing_slicing, which fail only on lines this change touches.
      # Per target, because the collectors are cfg-gated by platform.
      - name: Clippy (ratcheted)
        run: npm run lint:rust -- --target ${{ matrix.target }}

      - name: Test (nextest + doctests)
        env:
          NEXTEST_PROFILE: ci
        run: npm run test:rust

      # The pty harness: proves the built binary mounts, draws, answers a key
      # and exits (I-22b). Nothing else covers the shipped mount path.
      - name: Drive the built binary
        run: |
          cargo build --release -p sysmon --bin sysmon
          cargo run --release -p sysmon-harness --bin verify_tui -- \
            --bin target/release/sysmon --mock

      # 40 seeds for the same reason the Node fuzzer uses 40: a smaller run
      # passes clean with a known mode-stacking bug reinstated.
      - name: Fuzz the keyboard
        run: cargo run --release -p sysmon-harness --bin qa_fuzz -- --seeds 40 --steps 60

  # Licenses, advisories, sources, audits and unused dependencies: properties of
  # the lockfile rather than of a target, so one runner answers for all four.
  supply-chain:
    runs-on: ubuntu-latest
    name: supply chain

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/cache@v6
        id: cargo-tools
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_SUPPLY_CHAIN_TOOLS }}
      - name: Install the cargo tools
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: |
          read -ra tools <<< "$CARGO_SUPPLY_CHAIN_TOOLS"
          cargo install --locked --root ~/.cargo-tools "${tools[@]}"
      - run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"

      - name: cargo deny
        run: npm run deny:rust
      - name: cargo vet
        run: npm run vet:rust
      - name: cargo machete
        run: npm run machete:rust

  # Mutants on the PR's own diff: a changed function whose every mutation still
  # passes the tests is a function no test checks. On macOS, because most of
  # the cfg-gated collectors only compile there (.cargo/mutants.toml leaves out
  # the Linux one for the same reason).
  mutants:
    name: cargo-mutants on the PR diff
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the toolchain
        run: rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-mutants-

      - uses: actions/cache@v6
        id: cargo-tools
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_MUTANTS_TOOLS }}
      - name: Install the cargo tools
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: |
          read -ra tools <<< "$CARGO_MUTANTS_TOOLS"
          cargo install --locked --root ~/.cargo-tools "${tools[@]}"
      - run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"

      - name: Diff against the base branch
        run: git diff "origin/${GITHUB_BASE_REF}...HEAD" > "$RUNNER_TEMP/pr.diff"

      - name: Mutants that no test catches fail the PR
        run: cargo mutants --in-place --no-shuffle --in-diff "$RUNNER_TEMP/pr.diff"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutants.out
          path: mutants.out
          retention-days: 14

  # The four binaries a release ships. Built on every push, not just on a tag,
  # so a target that stops cross-compiling is found by the commit that broke it
  # rather than by the release that needed it.
  #
  # aarch64 Linux is cross-compiled from an x86 runner with its own linker,
  # rather than built on an ARM runner: the toolchain is a package away and
  # works on any Linux image, while runner availability is an account-level
  # thing this workflow should not depend on. The trade is that the result
  # cannot be executed here, so only the native targets are smoke-run.
  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
          - os: macos-latest
            target: x86_64-apple-darwin
            native: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            native: false

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v7

      - run: rustup target add ${{ matrix.target }}

      - name: Install the cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # actions/cache rather than a third-party Rust cache action: this repo's
      # Actions policy allows GitHub-owned actions only, and widening it for a
      # build cache is not a trade worth making.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - uses: actions/cache@v6
        id: cargo-tools
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_RELEASE_TOOLS }}
      - name: Install the cargo tools
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: |
          read -ra tools <<< "$CARGO_RELEASE_TOOLS"
          cargo install --locked --root ~/.cargo-tools "${tools[@]}"
      - run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"

      # Built exactly as release.yml builds it: `cargo auditable` embeds the
      # dependency list in the binary, so a shipped one can be audited later.
      - run: cargo auditable build --release --locked -p sysmon --bin sysmon --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Audit the embedded dependency list
        run: cargo audit bin target/${{ matrix.target }}/release/sysmon

      # A binary that will not run is not a binary — for the targets this runner
      # can actually execute.
      - name: Check it runs
        if: matrix.native
        run: ./target/${{ matrix.target }}/release/sysmon --version

      - uses: actions/upload-artifact@v7
        with:
          name: sysmon-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/sysmon
          if-no-files-found: error
