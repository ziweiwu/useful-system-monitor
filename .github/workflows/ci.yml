name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # macOS only: the collectors read ps/vm_stat/ioreg/pmset, and package.json
    # declares os: ["darwin"], so npm refuses to install anywhere else.
    runs-on: macos-latest

    strategy:
      fail-fast: false
      # Both Node lines package.json still claims to support: 24 is the current
      # LTS, 22 is in maintenance until April 2027. Testing only the newest
      # would leave the `engines` field an untested promise.
      matrix:
        node: [22, 24]

    name: check (node ${{ matrix.node }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the built CLI
        run: npm run verify:smoke
