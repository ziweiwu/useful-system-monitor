name: Release

# Publishes to npm when a version tag is pushed:
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # One binary per platform. aarch64 Linux is cross-compiled from an x86 runner
  # with its own linker rather than built on an ARM runner, so this does not
  # depend on runner availability; the others build natively.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v7

      - run: rustup target add ${{ matrix.target }}

      - name: Install the cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - run: cargo build --release -p sysmon --bin sysmon --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - uses: actions/upload-artifact@v7
        with:
          name: sysmon-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/sysmon
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-latest

    permissions:
      contents: read
      # Required for npm Trusted Publishing: GitHub mints a short-lived OIDC
      # token that npm verifies, so there is no long-lived secret to store,
      # rotate, or leak — and no 2FA prompt to answer from CI.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Publish from the current LTS. CI proves the package also runs on 22.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing needs npm 11.5.1+. Node 24 ships 11.17, so this is
      # belt-and-braces rather than a fix — but it costs seconds and it is what
      # keeps publishing working if the Node version here ever moves back.
      - run: npm install -g npm@latest

      - run: npm ci

      # The four binaries the build job produced, back into the tree where
      # build-npm-packages expects cargo to have left them.
      - uses: actions/download-artifact@v8
        with:
          pattern: sysmon-*
          path: artifacts

      - name: Put the binaries where cargo would have
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mkdir -p "target/$target/release"
            cp "artifacts/sysmon-$target/sysmon" "target/$target/release/sysmon"
            chmod +x "target/$target/release/sysmon"
          done

      - name: Verify before releasing
        run: |
          set -euo pipefail
          # package.json, the crate and the four optional deps must agree, or
          # `--version` reports a release the registry never published.
          npm run verify:versions
          npm run lint
          npm run typecheck
          npm test
          # The Rust gates. These are what `bin` now points at.
          cargo fmt --all --check
          cargo clippy --workspace --all-targets
          cargo test --workspace
          # The pty harness against the binary this release will ship (I-22b).
          cargo run --release -p sysmon-harness --bin verify_tui -- \
            --bin target/aarch64-apple-darwin/release/sysmon --mock
          cargo run --release -p sysmon-harness --bin qa_fuzz -- --seeds 40 --steps 60

      - name: Check the tag matches package.json
        # Tag pushes only: on a manual dispatch GITHUB_REF_NAME is the branch
        # name, so this compared "main" against the version and always failed.
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "releasing $PKG"

      - name: Assemble the per-platform packages
        run: npm run build:npm-packages

      # The platform packages go first, and the failure mode if they did not is
      # the reason: the main package declares them as optionalDependencies at an
      # exact version, so publishing it first would leave a window in which
      # `npm install useful-system-monitor` resolves the launcher and no binary.
      - name: Publish the binaries
        run: |
          set -euo pipefail
          for dir in npm/useful-system-monitor-*; do
            echo "publishing $dir"
            npm publish --access public "$dir"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        # No NODE_AUTH_TOKEN needed for the main package: authentication comes
        # from the OIDC token above. Falls back to NPM_TOKEN only if Trusted
        # Publishing is not configured.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
